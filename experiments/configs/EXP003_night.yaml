experiment_id: EXP003_night
description: "Feasibility experiment: Night illumination with sensor noise and low-light dynamics"
scene:
  name: "surrogate_aerial_campus"
  depth_type: "metric"
  source: "surrogate_ground_truth"
camera:
  type: "orbit"
  num_views: 5
  altitude: 80.0
  pitch: 45.0
  radius: 75.0
  width: 640
  height: 480
condition:
  weather: "clear"
  illumination: "night"
  domain: "real_uav"
  intensity: 0.90
  seed: 42
conditioning:
  use_depth: true
  use_edges: true
  use_semantics: true
quality_gate:
  min_bbox_iou: 0.50
  max_count_drift: 3
  min_edge_similarity: 0.25
