[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "layer4-generative-augmentation"
version = "0.1.0"
description = "Layer 4 Generative Augmentation Engine for Drone Data Augmentation Pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pillow>=9.5.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "pytest>=7.3.0"
]
